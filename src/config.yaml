site:
  name: 数智人心
  site: 'https://www.shrmcn.top'
  base: '/'
  trailingSlash: false
  googleSiteVerificationId: orcPxI47GSa-cRvY11tUe6iGg2IO_RPvnA1q95iEM3M

# 默认 SEO 元数据
metadata:
  title:
    default: 数智人心 —— 数字化时代的人力资源管理随笔与研究手记
    template: '%s — 数智人心'
  description: "在算法与数据之外看见组织里的人，记录一位研究者的人力资源数字化观察笔记"
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 数智人心
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

# 国际化设置
i18n:
  language: zh-CN
  textDirection: ltr

# 应用功能配置
apps:
  blog:
    isEnabled: true
    postsPerPage: 6
    post:
      isEnabled: true
      permalink: '/blog/%slug%'
      isRelatedPostsEnabled: true
      relatedPostsCount: 4
    categories:
      isEnabled: true
      pathname: category
    tags:
      isEnabled: true
      pathname: tag



# 界面主题设置
ui:
  theme: system
  enableAnimations: true
  showScrollProgress: true

# 页脚信息
footer:
  copyright: '© 2026 数智人心. All rights reserved.'
